services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: byt_review
      POSTGRES_USER: byt
      POSTGRES_PASSWORD: byt_dev_password
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byt -d byt_review"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://byt:byt_dev_password@postgres:5432/byt_review
      PUBLIC_MEDIA_BASE_URL: http://localhost:8000/media
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
